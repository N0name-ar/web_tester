<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ Backend API Tester - CarX VVIP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', Courier, monospace; background: #0c0c0c; color: #00ff66; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h2 { color: #fff; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .box { background: #141414; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; color: #888; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #1f1f1f; border: 1px solid #444; color: #fff; border-radius: 6px; font-family: monospace; margin-bottom: 10px; }
        textarea { height: 120px; resize: vertical; }
        button { background: #00ff66; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; text-transform: uppercase; }
        button:hover { background: #00cc55; }
        pre { background: #111; border: 1px solid #222; padding: 12px; border-radius: 6px; overflow-x: auto; color: #ff0055; font-size: 0.9em; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ CarX Cloud Backend API Tester</h2>

    <!-- BOX 1: LOGIN / AMBIL SESI -->
    <div class="box">
        <label>1️⃣ Login & Dapatkan Session ID</label>
        <div class="row">
            <input type="email" id="testEmail" placeholder="Email Game">
            <input type="password" id="testPass" placeholder="Password Game">
        </div>
        <button onclick="testLogin()">🔑 Eksekusi Login & Get Cars</button>
    </div>

    <!-- BOX 2: TEMBAK PAYLOAD BEBAS -->
    <div class="box">
        <label>2️⃣ Parameter & Payload Tester</label>
        <div class="row">
            <div>
                <label>Step Action:</label>
                <input type="text" id="testStep" value="edit_existing_car">
            </div>
            <div>
                <label>Session ID:</label>
                <input type="text" id="testSessionId" placeholder="Masukkan Session ID hasil login">
            </div>
        </div>
        <label>Payload JSON Tambahan (Opsional):</label>
        <textarea id="testPayload">{
  "car_id_pilihan": "0",
  "unlock_bodykits": true,
  "bodi_action": "lepas_bodi",
  "body_mass": 1200,
  "front_arm_length": 1.5,
  "long_arm_offset": 1.5,
  "steering_lock": 70
}</textarea>
        <button onclick="testApi()">🚀 Kirim Payload ke Backend</button>
    </div>

    <!-- BOX 3: LOG HASIL -->
    <div class="box">
        <label>📥 Respon Mentah dari Server:</label>
        <pre id="responseLog">Menunggu eksekusi...</pre>
    </div>
</div>

<script>
const GATEWAY_URL = 'https://bdehqzvzmtpvamcbyfmx.supabase.co/functions/v1/dasbor_tuning';

async function testLogin() {
    const email = document.getElementById('testEmail').value;
    const pass = document.getElementById('testPass').value;
    if(!email || !pass) { alert('Isi email & password!'); return; }

    document.getElementById('responseLog').textContent = '⏳ Menghubungkan...';
    try {
        const res = await fetch(GATEWAY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Copyright-Check': 'titik-temu-cloud-secured-v25-key-auth' },
            body: JSON.stringify({ step: 'login_and_get_cars', user: email, pass: pass, key: 'BYPASS' })
        });
        const text = await res.text();
        document.getElementById('responseLog').textContent = text;
        
        try {
            const json = JSON.parse(text);
            if(json.session_id) {
                document.getElementById('testSessionId').value = json.session_id;
            }
        } catch(e) {}
    } catch(err) {
        document.getElementById('responseLog').textContent = 'Error: ' + err.message;
    }
}

async function testApi() {
    const step = document.getElementById('testStep').value;
    const session_id = document.getElementById('testSessionId').value;
    let customData = {};
    
    try {
        customData = JSON.parse(document.getElementById('testPayload').value);
    } catch(e) {
        alert('Format JSON payload salah/tidak valid!');
        return;
    }

    const payload = {
        step: step,
        session_id: session_id,
        key: 'BYPASS',
        ...customData
    };

    document.getElementById('responseLog').textContent = '⏳ Mengirim payload tuning...';
    try {
        const res = await fetch(GATEWAY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Copyright-Check': 'titik-temu-cloud-secured-v25-key-auth' },
            body: JSON.stringify(payload)
        });
        const text = await res.text();
        document.getElementById('responseLog').textContent = text;
    } catch(err) {
        document.getElementById('responseLog').textContent = 'Error: ' + err.message;
    }
}
</script>

</body>
</html>
